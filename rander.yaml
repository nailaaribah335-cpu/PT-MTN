services:
  - type: web
    name: web-laravel-mtn
    runtime: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: apache2-foreground
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: db-laravel-mtn
          property: connectionString

databases:
  - name: db-laravel-mtn
    databaseName: mtn_db
    user: mtn_user
    plan: free